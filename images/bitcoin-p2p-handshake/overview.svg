<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#F5F7FA"/><text x="70" y="69" font-family="Hiragino Sans, sans-serif" font-size="24" font-weight="600" fill="#087F8C">BITCOIN BASICS / NETWORK</text><text x="70" y="146" font-family="Hiragino Sans, sans-serif" font-size="48" font-weight="600" fill="#172D45">接続できた ≠ データを信用できる</text><text x="70" y="196" font-family="Hiragino Sans, sans-serif" font-size="25" font-weight="400" fill="#53677C">TCP → transport → アプリケーションの挨拶 → データの検証</text><rect x="70" y="245" width="680" height="205" rx="20" fill="white" stroke="#D7E1E9" stroke-width="2"/><text x="98" y="303" font-family="Hiragino Sans, sans-serif" font-size="32" font-weight="600" fill="#087F8C">01  TCP接続</text><text x="98" y="357" font-family="Hiragino Sans, sans-serif" font-size="26" font-weight="400" fill="#172D45">順序どおりにバイト列を届ける</text><text x="98" y="399" font-family="Hiragino Sans, sans-serif" font-size="26" font-weight="400" fill="#172D45">まだBitcoinの機能は分からない</text><rect x="850" y="245" width="680" height="205" rx="20" fill="white" stroke="#D7E1E9" stroke-width="2"/><text x="878" y="303" font-family="Hiragino Sans, sans-serif" font-size="32" font-weight="600" fill="#087F8C">02  transportの準備</text><text x="878" y="357" font-family="Hiragino Sans, sans-serif" font-size="26" font-weight="400" fill="#172D45">v1：平文のメッセージ形式</text><text x="878" y="399" font-family="Hiragino Sans, sans-serif" font-size="26" font-weight="400" fill="#172D45">v2：鍵交換などをして暗号化</text><path d="M760,348 L838,348" stroke="#53677C" stroke-width="4"/><polygon points="838,348 823.0810964478636,356.15023415627144 823.0810964478636,339.84976584372856" fill="#53677C"/><path d="M1190,465 L1190,530" stroke="#53677C" stroke-width="4"/><polygon points="1190,530 1181.8497658437286,515.0810964478636 1198.1502341562714,515.0810964478636" fill="#53677C"/><rect x="850" y="545" width="680" height="230" rx="20" fill="white" stroke="#D7E1E9" stroke-width="2"/><text x="878" y="603" font-family="Hiragino Sans, sans-serif" font-size="32" font-weight="600" fill="#D76A14">03  アプリケーションの挨拶</text><text x="878" y="657" font-family="Hiragino Sans, sans-serif" font-size="26" font-weight="400" fill="#172D45">version：機能・状態の自己申告</text><text x="878" y="699" font-family="Hiragino Sans, sans-serif" font-size="26" font-weight="400" fill="#172D45">wtxidrelay / sendaddrv2：機能通知</text><text x="878" y="741" font-family="Hiragino Sans, sans-serif" font-size="26" font-weight="400" fill="#172D45">verack：確認</text><rect x="70" y="545" width="680" height="230" rx="20" fill="white" stroke="#D7E1E9" stroke-width="2"/><text x="98" y="603" font-family="Hiragino Sans, sans-serif" font-size="32" font-weight="600" fill="#087F8C">04  データ交換と検証</text><text x="98" y="657" font-family="Hiragino Sans, sans-serif" font-size="26" font-weight="400" fill="#172D45">取引やブロックを受け取る</text><text x="98" y="699" font-family="Hiragino Sans, sans-serif" font-size="26" font-weight="400" fill="#172D45">UTXO・Scriptなどを自分で検証</text><text x="98" y="741" font-family="Hiragino Sans, sans-serif" font-size="26" font-weight="400" fill="#172D45">挨拶が済んでも、不正データは拒否</text><path d="M838,660 L760,660" stroke="#53677C" stroke-width="4"/><polygon points="760,660 774.9189035521364,651.8497658437285 774.9189035521364,668.1502341562715" fill="#53677C"/><text x="80" y="867" font-family="Hiragino Sans, sans-serif" font-size="36" font-weight="600" fill="#172D45">機能の自己申告は、正しさの証明ではない。</text><text x="80" y="920" font-family="Hiragino Sans, sans-serif" font-size="28" font-weight="400" fill="#53677C">v2の暗号化も、標準では接続相手の身元を認証しない。</text></svg>