<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#F5F7FA"/><text x="70" y="69" font-family="Hiragino Sans, sans-serif" font-size="24" font-weight="600" fill="#087F8C">BITCOIN BASICS / SCRIPT</text><text x="70" y="146" font-family="Hiragino Sans, sans-serif" font-size="48" font-weight="600" fill="#172D45">支払い条件は、使うときに検証する</text><text x="70" y="196" font-family="Hiragino Sans, sans-serif" font-size="25" font-weight="400" fill="#53677C">native P2WPKH：古い出力の条件 ＋ 新しい取引の証拠と文脈</text><rect x="70" y="245" width="680" height="235" rx="20" fill="white" stroke="#D7E1E9" stroke-width="2"/><text x="98" y="303" font-family="Hiragino Sans, sans-serif" font-size="32" font-weight="600" fill="#087F8C">古い出力（UTXO）</text><text x="98" y="357" font-family="Hiragino Sans, sans-serif" font-size="26" font-weight="400" fill="#172D45">金額：100,000 sat</text><text x="98" y="399" font-family="Hiragino Sans, sans-serif" font-size="26" font-weight="400" fill="#172D45">scriptPubKey：OP_0 &lt;H&gt;</text><text x="98" y="441" font-family="Hiragino Sans, sans-serif" font-size="26" font-weight="400" fill="#172D45">H = HASH160（Aliceの公開鍵）</text><rect x="850" y="245" width="680" height="235" rx="20" fill="white" stroke="#D7E1E9" stroke-width="2"/><text x="878" y="303" font-family="Hiragino Sans, sans-serif" font-size="32" font-weight="600" fill="#D76A14">新しい取引の入力</text><text x="878" y="357" font-family="Hiragino Sans, sans-serif" font-size="26" font-weight="400" fill="#172D45">参照先：txid + vout</text><text x="878" y="399" font-family="Hiragino Sans, sans-serif" font-size="26" font-weight="400" fill="#172D45">scriptSig：空</text><text x="878" y="441" font-family="Hiragino Sans, sans-serif" font-size="26" font-weight="400" fill="#172D45">witness：署名 S、公開鍵 P</text><path d="M410,492 L410,545" stroke="#53677C" stroke-width="4"/><polygon points="410,545 401.84976584372856,530.0810964478636 418.15023415627144,530.0810964478636" fill="#53677C"/><path d="M1190,492 L1190,545" stroke="#53677C" stroke-width="4"/><polygon points="1190,545 1181.8497658437286,530.0810964478636 1198.1502341562714,530.0810964478636" fill="#53677C"/><rect x="70" y="560" width="1460" height="220" rx="20" fill="white" stroke="#D7E1E9" stroke-width="2"/><text x="98" y="618" font-family="Hiragino Sans, sans-serif" font-size="32" font-weight="600" fill="#087F8C">P2WPKHの検証</text><text x="98" y="672" font-family="Hiragino Sans, sans-serif" font-size="26" font-weight="400" fill="#172D45">① HASH160(P) と H を照合 → 指定された鍵か？</text><text x="98" y="714" font-family="Hiragino Sans, sans-serif" font-size="26" font-weight="400" fill="#172D45">② 取引の文脈から署名対象を計算し、S を P で検証</text><text x="98" y="756" font-family="Hiragino Sans, sans-serif" font-size="26" font-weight="400" fill="#172D45">③ エラーなく終了し、スタックに真の要素が1個残ることを確認</text><text x="80" y="865" font-family="Hiragino Sans, sans-serif" font-size="34" font-weight="600" fill="#172D45">正しい署名だけでは、取引全体の有効性は決まらない。</text><text x="80" y="919" font-family="Hiragino Sans, sans-serif" font-size="27" font-weight="400" fill="#53677C">UTXOを使えるか、入力と出力の金額が整合するかなども別途検査する。</text></svg>